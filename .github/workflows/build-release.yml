name: Build and Release

on:
  repository_dispatch:
    types: [trigger-build]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  copy-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Download release from private repo
        run: |
          VERSION=${{ github.event.inputs.version || github.event.client_payload.version || 'v1.0.0' }}
          echo "Downloading release $VERSION from goodpcb/GS_Flutter_Modbus_TCP..."

          # 下载私有库的 Release 信息
          RELEASE_DATA=$(curl -sL -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/goodpcb/GS_Flutter_Modbus_TCP/releases/tags/$VERSION")

          if [ -z "$RELEASE_DATA" ] || [ "$RELEASE_DATA" = "Not Found" ]; then
            echo "Error: Release $VERSION not found in private repo!"
            exit 1
          fi

          # 提取文件下载链接
          WINDOWS_URL=$(echo "$RELEASE_DATA" | grep -oP '(?<="browser_download_url": ")[^"]*windows[^"]*' || true)
          ANDROID_URL=$(echo "$RELEASE_DATA" | grep -oP '(?<="browser_download_url": ")[^"]*.apk' || true)

          # 下载文件
          if [ -n "$WINDOWS_URL" ]; then
            curl -L -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" -o smhms-windows.zip "$WINDOWS_URL"
            echo "Downloaded: smhms-windows.zip"
          else
            echo "Warning: Windows asset not found!"
          fi

          if [ -n "$ANDROID_URL" ]; then
            curl -L -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" -o app-release.apk "$ANDROID_URL"
            echo "Downloaded: app-release.apk"
          else
            echo "Warning: Android asset not found!"
          fi

          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.event.client_payload.version || 'v1.0.0' }}
          files: |
            smhms-windows.zip
            app-release.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
