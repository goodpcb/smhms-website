name: Build and Release

on:
  repository_dispatch:
    types: [trigger-build]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  copy-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Check PAT_TOKEN is set
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "Error: PAT_TOKEN secret is not set!"
            exit 1
          fi

      - name: Download release from private repo
        env:
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version || 'v1.0.0' }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Downloading release $VERSION from goodpcb/GS_Flutter_Modbus_TCP..."

          # 下载私有库的 Release 信息
          RELEASE_DATA=$(curl -sL -H "Authorization: Bearer $PAT_TOKEN" \
            "https://api.github.com/repos/goodpcb/GS_Flutter_Modbus_TCP/releases/tags/$VERSION")

          echo "Release data length: ${#RELEASE_DATA}"
          echo "First 500 chars: ${RELEASE_DATA:0:500}"

          # 检查是否包含 "Not Found"
          if echo "$RELEASE_DATA" | grep -q "Not Found"; then
            echo "Error: Release $VERSION not found in private repo!"
            exit 1
          fi

          # 使用 jq 提取下载链接（更可靠）
          WINDOWS_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("windows|zip"; "i")) | .browser_download_url')
          ANDROID_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test(".apk"; "i")) | .browser_download_url')

          echo "Windows URL: $WINDOWS_URL"
          echo "Android URL: $ANDROID_URL"

          # 下载文件并检查大小
          if [ -n "$WINDOWS_URL" ] && [ "$WINDOWS_URL" != "null" ]; then
            curl -L -f -H "Authorization: Bearer $PAT_TOKEN" -o smhms-windows.zip "$WINDOWS_URL"
            WINDOWS_SIZE=$(stat -c%s smhms-windows.zip 2>/dev/null || stat -f%z smhms-windows.zip 2>/dev/null || ls -la smhms-windows.zip | awk '{print $5}')
            echo "Windows file size: $WINDOWS_SIZE bytes"
            if [ "$WINDOWS_SIZE" -lt 1000 ]; then
              echo "ERROR: Windows file too small (likely error)!"
              cat smhms-windows.zip
              exit 1
            fi
          else
            echo "Warning: Windows asset not found!"
          fi

          if [ -n "$ANDROID_URL" ] && [ "$ANDROID_URL" != "null" ]; then
            curl -L -f -H "Authorization: Bearer $PAT_TOKEN" -o app-release.apk "$ANDROID_URL"
            ANDROID_SIZE=$(stat -c%s app-release.apk 2>/dev/null || stat -f%z app-release.apk 2>/dev/null || ls -la app-release.apk | awk '{print $5}')
            echo "Android file size: $ANDROID_SIZE bytes"
            if [ "$ANDROID_SIZE" -lt 1000 ]; then
              echo "ERROR: Android file too small (likely error)!"
              cat app-release.apk
              exit 1
            fi
          else
            echo "Warning: Android asset not found!"
          fi

          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.event.client_payload.version || 'v1.0.0' }}
          files: |
            smhms-windows.zip
            app-release.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
