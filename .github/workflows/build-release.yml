name: Build and Release

on:
  repository_dispatch:
    types: [trigger-build]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: goodpcb/GS_Flutter_Modbus_TCP
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.event.inputs.version || github.event.client_payload.version || 'master' }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath smhms-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: smhms-windows.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: goodpcb/GS_Flutter_Modbus_TCP
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.event.inputs.version || github.event.client_payload.version || 'master' }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: goodpcb/GS_Flutter_Modbus_TCP
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.event.inputs.version || github.event.client_payload.version || 'master' }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${{ github.event.inputs.version || github.event.client_payload.version || 'v1.0.0' }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n1)

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to $VERSION..."
            CHANGELOG=$(git log ${PREV_TAG}..${VERSION} --pretty=format:"- %s" --no-merges)
          else
            echo "No previous tag found, generating changelog for all commits..."
            CHANGELOG=$(git log ${VERSION} --pretty=format:"- %s" --no-merges -20)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 更新至 $VERSION"
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "--- Changelog ---"
          echo "$CHANGELOG"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          body: |
            ## ${{ steps.changelog.outputs.version }}

            ### 变更内容

            ${{ steps.changelog.outputs.changelog }}
          files: |
            smhms-windows.zip
            app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
