name: Build and Release

on:
  repository_dispatch:
    types: [trigger-build]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: goodpcb/GS_Flutter_Modbus_TCP
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.event.inputs.version || github.event.client_payload.version || 'master' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath smhms-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: smhms-windows.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: goodpcb/GS_Flutter_Modbus_TCP
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.event.inputs.version || github.event.client_payload.version || 'master' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.event.client_payload.version || 'v1.0.0' }}
          body: |
            ## 新版本发布

            版本: ${{ github.event.inputs.version || github.event.client_payload.version || 'v1.0.0' }}

            请查看完整更新日志。
          files: |
            smhms-windows.zip
            app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
